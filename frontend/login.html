<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>ORCA Login</title>
<style>body{font-family:sans-serif;background:#0f1535;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
form{background:rgba(255,255,255,0.05);padding:2rem;border-radius:1.5rem;border:1px solid rgba(255,255,255,0.1);width:320px}
h2{margin-top:0}input,select{width:100%;padding:.7rem;margin:.5rem 0;border:none;border-radius:.5rem;background:rgba(255,255,255,0.1);color:#fff;font-size:1rem}
button{width:100%;padding:.7rem;border:none;border-radius:.5rem;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
button:hover{background:#1d4ed8}</style>
</head>
<body>
<form onsubmit="event.preventDefault(); const n=document.getElementById('name').value; const l=document.getElementById('lang').value; fetch('http://localhost:8000/api/user/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,language:l})}).then(r=>r.json()).then(j=>{localStorage.setItem('orca_user_id', j.id); localStorage.setItem('orca_lang', j.language); alert('Welcome '+j.name+'! Language set to '+j.language); window.location.href='http://localhost:5173/';});">
<h2>ORCA — Welcome Fisherman</h2>
<p style="font-size:.85rem;color:#aaa">No password needed. Just enter your name.</p>
<input id="name" placeholder="Your name" required>
<select id="lang"><option value="en">English</option><option value="hi">Hindi</option><option value="ta">Tamil</option><option value="te">Telugu</option><option value="ml">Malayalam</option></select>
<button type="submit">Save & Open App</button>
</form>
</body>
</html>
